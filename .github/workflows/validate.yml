name: Validate manifests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate marketplace manifests
        run: |
          python3 scripts/validate_manifests.py --self-test
          python3 scripts/validate_manifests.py

      - name: Check the edit hook is working-directory independent
        # Run from a subdirectory on purpose: the hook is invoked by the agent
        # harness, which makes no promise about the working directory.
        run: cd plugins && python3 ../scripts/hooks/validate_on_edit.py --self-test

      - name: Run per-plugin validators
        run: |
          shopt -s nullglob
          for script in plugins/*/scripts/validate.py; do
            echo "== $script =="
            python3 "$script" --self-test
            python3 "$script"
          done
